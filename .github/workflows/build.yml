name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - if: runner.os == 'Windows'
        run: cmake -S . -B build/x86/${{ matrix.config }} -A Win32
      - if: runner.os == 'Linux'
        run: cmake -S . -B build/x86/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build/x86/${{ matrix.config }} --config ${{ matrix.config }} --parallel 4
      - run: ctest --test-dir build/x86/${{ matrix.config }} -C ${{ matrix.config }} --output-on-failure
      - run: cmake --install build/x86/${{ matrix.config }} --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        with:
          name: slowdl-${{ runner.os }}-x86-${{ matrix.config }}
          path: install/x86/${{ matrix.config }}/addons/
          if-no-files-found: error
