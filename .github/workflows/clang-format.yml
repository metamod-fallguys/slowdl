name: clang-format
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.3
      - run: cmake -S . -B build/format -DFORMAT_VALIDATION_ONLY=ON
      - run: cmake --build build/format --target slowdl-format-check
